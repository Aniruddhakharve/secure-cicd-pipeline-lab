name: Main Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  lint:
    uses: ./.github/workflows/reusable-lint.yml

  build-test:
    needs: lint
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run-tests: true

  sast:
    needs: lint
    uses: ./.github/workflows/reusable-sast.yml

  secret-scan:
    needs: lint
    uses: ./.github/workflows/reusable-secret-scan.yml

  dependency-scan:
    needs: lint
    uses: ./.github/workflows/reusable-dependency-scan.yml

  dockerfile-lint:
    needs: lint
    uses: ./.github/workflows/reusable-dockerfile-lint.yml

  docker-build:
    needs: [lint, build-test, sast , secret-scan, dependency-scan , dockerfile-lint]
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      image_name: "secure-cicd-pipeline-lab"
      image_tag: ${{ github.sha }}
      docker_username: ${{ vars.DOCKER_USERNAME }}

  trivy-scan:
    needs: [docker-build]
    uses: ./.github/workflows/reusable-trivy-scan.yml
    with:
      image_ref: ${{ needs.docker-build.outputs.image_ref }}
      artifact_name: ${{ needs.docker-build.outputs.artifact_name }}

  docker-push:
    needs: [docker-build, trivy-scan]
    uses: ./.github/workflows/reusable-docker-push.yml
    with:
      image_ref: ${{ needs.docker-build.outputs.image_ref }}
      artifact_name: ${{ needs.docker-build.outputs.artifact_name }}
      docker_username: ${{ vars.DOCKER_USERNAME }}
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}

  aws-ssm-test:
    needs: [docker-push]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-aws-ssm-test.yml
    with:
      image-tag: ${{ github.sha }}

  show-result:
    needs:
      - lint
      - build-test
      - sast
      - secret-scan
      - dependency-scan
      - dockerfile-lint
      - docker-build
      - trivy-scan
    runs-on: ubuntu-latest

    steps:
      - name: Show pipeline results
        run: |
          echo "Main pipeline lint result: ${{ needs.lint.outputs.lint_result }}"
          echo "Main pipeline test result: ${{ needs.build-test.outputs.test_result }}"
          echo "Main pipeline SAST result: ${{ needs.sast.outputs.sast_result }}"
          echo "Main pipeline secret scan result: ${{ needs.secret-scan.outputs.secret_scan_result }}"
          echo "Main pipeline dependency scan result: ${{ needs.dependency-scan.outputs.dependency_scan_result }}"
          echo "Main pipeline Dockerfile lint result: ${{ needs.dockerfile-lint.outputs.dockerfile_lint_result }}"
          echo "Docker image: ${{ needs.docker-build.outputs.image_ref }}"
          echo "Docker artifact: ${{ needs.docker-build.outputs.artifact_name }}"
          echo "Trivy scan result: ${{ needs.trivy-scan.outputs.trivy_result }}"
