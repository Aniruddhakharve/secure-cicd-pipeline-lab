name: Reusable SAST

on:
  workflow_call:
    outputs:
        sast_result:
            description: "Result of the SAST scan"
            value: ${{ jobs.sast-summary.outputs.sast_result }}

jobs:
    sast:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

            - name: setup python
              uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
              with:
                python-version: "3.12"
                cache: "pip"
            
            - name: Install Semgrep
              run: |
                python -m pip install --upgrade pip
                python -m pip install semgrep

            - name: Run Semgrep
              run: |
                semgrep scan --config=auto --sarif --output=semgrep-results.sarif

            - name: upload sempgrep report
              uses: github/codeql-action/upload-sarif@f035ce3a985a1223a9f59fb719542598640160b2 #v2.27.1
              with:
                sarif_file: semgrep-results.sarif

    sast-summary:
        if: ${{ always() }}
        needs: sast

        outputs:
            sast_result: ${{ steps.summary.outputs.sast_result }}

        runs-on: ubuntu-latest

        steps:
            - name: Generate SAST result
              id: summary
              run: |
                if [ "${{ needs.sast.result }}" = "success" ]; then
                   echo "SAST scan passed."
                   echo "sast_result=passed" >> "$GITHUB_OUTPUT"
                else
                   echo "SAST scan failed."
                   echo "sast_result=failed" >> "$GITHUB_OUTPUT"
                   exit 1
                fi