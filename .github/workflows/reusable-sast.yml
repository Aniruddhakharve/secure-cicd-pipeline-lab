name: Reusable SAST

on:
  workflow_call:
    outputs:
        sast_result:
            description: "Result of the SAST scan"
            value: ${{ jobs.sast-summary.outputs.sast_result }}

jobs:
    sast:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: "3.12"
                cache: "pip"
            
            - name: Install Semgrep
              run: |
                python -m pip install --upgrade pip
                python -m pip install semgrep

            - name: Run Semgrep
              run: |
                semgrep scan --config=auto --sarif --output=semgrep-results.sarif

            - name: upload sempgrep report
              uses: github/codeql-action/upload-sarif@v4
              with:
                sarif_file: semgrep-results.sarif

    sast-summary:
        if: ${{ always() }}
        needs: sast

        outputs:
            sast_result: ${{ steps.summary.outputs.sast_result }}

        runs-on: ubuntu-latest

        steps:
            - name: Generate SAST result
              id: summary
              run: |
                if [ "${{ needs.sast.result }}" = "success" ]; then
                   echo "SAST scan passed."
                   echo "sast_result=passed" >> "$GITHUB_OUTPUT"
                else
                   echo "SAST scan failed."
                   echo "sast_result=failed" >> "$GITHUB_OUTPUT"
                   exit 1
                fi