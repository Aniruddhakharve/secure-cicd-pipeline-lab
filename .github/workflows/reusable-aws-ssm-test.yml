name: Reusable AWS SSM Test

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

jobs:
  aws-ssm-test:
    runs-on: ubuntu-latest

    environment: Production

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@3557a071ad648a12260a481c2e613d138d99c690
        with:
          role-to-assume: arn:aws:iam::577267183903:role/GitHubActions-Production-Deploy
          aws-region: ap-south-1

      # --------------------------------------------------
      # 2. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # 3. Install AWS CLI v2 on production EC2
      # --------------------------------------------------
      - name: Install AWS CLI on production EC2
        run: |
          COMMANDS=$(python3 -c 'import json; print(json.dumps({"commands": [
            "set -e",
            "if command -v aws >/dev/null 2>&1; then echo \"AWS CLI already installed.\"; else apt-get update && apt-get install -y curl unzip && curl -fsSL \"https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip\" -o /tmp/awscliv2.zip && unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install && rm -rf /tmp/aws /tmp/awscliv2.zip; fi",
            "aws --version"
          ]}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. Wait for AWS CLI installation
      # --------------------------------------------------
      - name: Wait for AWS CLI installation
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 5. Read AWS CLI installation result
      # --------------------------------------------------
      - name: Read AWS CLI installation result
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      # --------------------------------------------------
      # 6. Create production environment
      # --------------------------------------------------
      - name: Create production environment
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: |
          COMMANDS=$(python3 <<'PY'
          import json
          import os

          username = os.environ["DOCKER_USERNAME"]
          tag = os.environ["IMAGE_TAG"]

          commands = [
              "set -e",
              "trap 'rm -f /tmp/production-secret.json' EXIT",
              "mkdir -p /opt/secure-cicd-pipeline-lab",
              "umask 077",

              f"printf 'DOCKER_USERNAME=%s\\n' '{username}' > /opt/secure-cicd-pipeline-lab/.env",
              f"printf 'IMAGE_TAG=%s\\n' '{tag}' >> /opt/secure-cicd-pipeline-lab/.env",

              "aws secretsmanager get-secret-value --secret-id secure-cicd-pipeline-lab/production --query SecretString --output text > /tmp/production-secret.json",
              "chmod 600 /tmp/production-secret.json",

              """python3 -c 'import json; from pathlib import Path; s=json.load(open("/tmp/production-secret.json")); p=Path("/opt/secure-cicd-pipeline-lab/.env"); f=p.open("a"); f.write("MYSQL_DATABASE=" + s["MYSQL_DATABASE"] + "\\n"); f.write("MYSQL_USER=" + s["MYSQL_USER"] + "\\n"); f.write("MYSQL_PASSWORD=" + s["MYSQL_PASSWORD"] + "\\n"); f.write("MYSQL_ROOT_PASSWORD=" + s["MYSQL_ROOT_PASSWORD"] + "\\n"); f.close()'""",

              "chmod 600 /opt/secure-cicd-pipeline-lab/.env",

              """python3 -c 'from pathlib import Path; required={"DOCKER_USERNAME","IMAGE_TAG","MYSQL_DATABASE","MYSQL_USER","MYSQL_PASSWORD","MYSQL_ROOT_PASSWORD"}; keys={line.split("=",1)[0] for line in Path("/opt/secure-cicd-pipeline-lab/.env").read_text().splitlines() if "=" in line}; print("Generated .env keys:", sorted(keys)); missing=required-keys; assert not missing, "Missing required environment variables: " + str(sorted(missing)); print("Production .env created successfully.")'"""
          ]

          print(json.dumps({"commands": commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Wait for production environment creation
      # --------------------------------------------------
      - name: Wait for production environment creation
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 8. Read production environment creation result
      # --------------------------------------------------
      - name: Read production environment creation result
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json