name: Reusable AWS SSM Test

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

jobs:
    aws-ssm-test:
        runs-on: ubuntu-latest

        environment: Production

        permissions:
            id-token: write
            contents: read


        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@3557a071ad648a12260a481c2e613d138d99c690
              with:
                role-to-assume: arn:aws:iam::577267183903:role/GitHubActions-Production-Deploy
                aws-region: ap-south-1

            - name: Verify AWS identity
              run: |
                aws sts get-caller-identity



            - name: Create production deployment directory
              env:
                  IMAGE_TAG: ${{ inputs.image-tag }}
                  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
              run: |
                COMMAND_ID=$(aws ssm send-command \
                --instance-ids i-00b53b698111d659e \
                --document-name "AWS-RunShellScript" \
                --parameters commands="mkdir -p /opt/secure-cicd-pipeline-lab,echo DOCKER_USERNAME=$DOCKER_USERNAME > /opt/secure-cicd-pipeline-lab/.env,echo IMAGE_TAG=$IMAGE_TAG >> /opt/secure-cicd-pipeline-lab/.env,cat /opt/secure-cicd-pipeline-lab/.env" \
                --query "Command.CommandId" \
                --output text)

                echo "SSM Command ID: $COMMAND_ID"
                echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"



            - name: Wait for SSM command
              run: |
                aws ssm wait command-executed \
                --command-id "$COMMAND_ID" \
                --instance-id i-00b53b698111d659e

            - name: Read SSM command result
              run: |
                aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-00b53b698111d659e \
                --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}' \
                --output json

