name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
    lint:
        uses: ./.github/workflows/reusable-lint.yml

    build-test:
        needs: lint
        uses: ./.github/workflows/reusable-build-test.yml
        with:
            run-tests: true

    sast:
        needs: lint
        uses: ./.github/workflows/reusable-sast.yml

    secret-scan:
        needs: lint
        uses: ./.github/workflows/reusable-secret-scan.yml

    dependency-scan:
        needs: lint
        uses: ./.github/workflows/reusable-dependency-scan.yml

    show-result:
        needs: [lint, build-test, sast, secret-scan, dependency-scan]
        runs-on: ubuntu-latest
        steps:
            - name: Show pipeline results
              run: |
                echo "Lint result: ${{ needs.lint.outputs.lint_result}}"
                echo "Reusable workflow test result: ${{ needs.build-test.outputs.test_result }}"
                echo "SAST result: ${{ needs.sast.outputs.sast_result }}"
                echo "Secret scan result: ${{ needs.secret-scan.outputs.secret_scan_result }}"
                echo "Dependency scan result: ${{ needs.dependency-scan.outputs.dependency_scan_result }}"