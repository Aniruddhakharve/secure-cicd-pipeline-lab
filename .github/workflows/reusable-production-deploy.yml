name: Reusable Production Deploy

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

    outputs:
      deployment_result:
        description: "Result of the production deployment"
        value: ${{ jobs.production-deploy.outputs.deployment_result }}

jobs:

  production-deploy:
    runs-on: ubuntu-latest

    environment: Production

    permissions:
      id-token: write
      contents: read

    outputs:
      deployment_result: ${{ steps.deployment_result.outputs.deployment_result }}

    steps:

      # --------------------------------------------------
      # 1. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@3557a071ad648a12260a481c2e613d138d99c690
        with:
          role-to-assume: arn:aws:iam::577267183903:role/GitHubActions-Production-Deploy
          aws-region: ap-south-1

      # --------------------------------------------------
      # 2. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # 3. Install AWS CLI v2 on production EC2
      # --------------------------------------------------
      - name: Install AWS CLI on production EC2
        run: |
          COMMANDS=$(python3 -c 'import json; print(json.dumps({"commands": [
            "set -e",
            "if command -v aws >/dev/null 2>&1; then echo \"AWS CLI already installed.\"; else apt-get update && apt-get install -y curl unzip && curl -fsSL \"https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip\" -o /tmp/awscliv2.zip && unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install && rm -rf /tmp/aws /tmp/awscliv2.zip; fi",
            "aws --version"
          ]}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. Wait for AWS CLI installation
      # --------------------------------------------------
      - name: Wait for AWS CLI installation
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 5. Read AWS CLI installation result
      # --------------------------------------------------
      - name: Read AWS CLI installation result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 6. Install Docker Engine and Docker Compose
      # --------------------------------------------------
      - name: Install Docker and Docker Compose on production EC2
        run: |
          COMMANDS=$(python3 <<'PY'
          import json

          commands = [
              "set -e",

              """if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
                echo "Docker or Docker Compose is missing. Installing required packages..."

                apt-get update
                apt-get install -y ca-certificates curl

                install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
                chmod a+r /etc/apt/keyrings/docker.asc

                cat > /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF

                apt-get update
                apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              else
                echo "Docker Engine and Docker Compose are already installed."
              fi""",

              "systemctl enable --now docker",

              "docker --version",

              "docker compose version"
          ]

          print(json.dumps({"commands": commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Wait for Docker installation
      # --------------------------------------------------
      - name: Wait for Docker installation
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 8. Read Docker installation result
      # --------------------------------------------------
      - name: Read Docker installation result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 9. Create production environment
      # --------------------------------------------------
      - name: Create production environment
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: |
          COMMANDS=$(python3 <<'PY'
          import json
          import os

          username = os.environ["DOCKER_USERNAME"]
          tag = os.environ["IMAGE_TAG"]

          commands = [
              "set -e",
              "trap 'rm -f /tmp/production-secret.json' EXIT",
              "mkdir -p /opt/secure-cicd-pipeline-lab",
              "umask 077",

              f"printf 'DOCKER_USERNAME=%s\\n' '{username}' > /opt/secure-cicd-pipeline-lab/.env",
              f"printf 'IMAGE_TAG=%s\\n' '{tag}' >> /opt/secure-cicd-pipeline-lab/.env",

              "aws secretsmanager get-secret-value --secret-id secure-cicd-pipeline-lab/production --query SecretString --output text > /tmp/production-secret.json",
              "chmod 600 /tmp/production-secret.json",

              """python3 -c 'import json; from pathlib import Path; s=json.load(open("/tmp/production-secret.json")); p=Path("/opt/secure-cicd-pipeline-lab/.env"); f=p.open("a"); f.write("MYSQL_DATABASE=" + s["MYSQL_DATABASE"] + "\\n"); f.write("MYSQL_USER=" + s["MYSQL_USER"] + "\\n"); f.write("MYSQL_PASSWORD=" + s["MYSQL_PASSWORD"] + "\\n"); f.write("MYSQL_ROOT_PASSWORD=" + s["MYSQL_ROOT_PASSWORD"] + "\\n"); f.close()'""",

              "chmod 600 /opt/secure-cicd-pipeline-lab/.env",

              """python3 -c 'from pathlib import Path; required={"DOCKER_USERNAME","IMAGE_TAG","MYSQL_DATABASE","MYSQL_USER","MYSQL_PASSWORD","MYSQL_ROOT_PASSWORD"}; keys={line.split("=",1)[0] for line in Path("/opt/secure-cicd-pipeline-lab/.env").read_text().splitlines() if "=" in line}; print("Generated .env keys:", sorted(keys)); missing=required-keys; assert not missing, "Missing required environment variables: " + str(sorted(missing)); print("Production .env created successfully.")'"""
          ]

          print(json.dumps({"commands": commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 10. Wait for production environment creation
      # --------------------------------------------------
      - name: Wait for production environment creation
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 11. Read production environment creation result
      # --------------------------------------------------
      - name: Read production environment creation result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 12. Download exact docker-compose.yml from commit
      # --------------------------------------------------
      - name: Download production compose file
        env:
          COMMIT_SHA: ${{ inputs.image-tag }}
        run: |
          COMMANDS=$(python3 -c 'import json, os; sha=os.environ["COMMIT_SHA"]; print(json.dumps({"commands": [
            "set -e",
            "mkdir -p /opt/secure-cicd-pipeline-lab",
            "curl -fsSL https://raw.githubusercontent.com/Aniruddhakharve/secure-cicd-pipeline-lab/" + sha + "/docker-compose.yml -o /opt/secure-cicd-pipeline-lab/docker-compose.yml",
            "test -s /opt/secure-cicd-pipeline-lab/docker-compose.yml",
            "echo \"Production compose file downloaded successfully.\""
          ]}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 13. Wait for compose file download
      # --------------------------------------------------
      - name: Wait for compose file download
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 14. Read compose file download result
      # --------------------------------------------------
      - name: Read compose file download result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 15. Verify Docker Compose configuration
      # --------------------------------------------------
      - name: Verify Docker Compose configuration
        run: |
          COMMANDS=$(python3 -c 'import json; print(json.dumps({"commands": [
            "set -e",
            "cd /opt/secure-cicd-pipeline-lab",
            "docker compose config --images"
          ]}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 16. Wait for Compose verification
      # --------------------------------------------------
      - name: Wait for Compose verification
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 17. Read Compose verification result
      # --------------------------------------------------
      - name: Read Compose verification result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 18. Pull production Docker images
      # --------------------------------------------------
      - name: Pull production Docker images
        run: |
          COMMANDS=$(python3 -c 'import json; print(json.dumps({"commands": [
            "set -e",
            "cd /opt/secure-cicd-pipeline-lab",
            "docker compose pull"
          ]}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 19. Wait for Docker image pull
      # --------------------------------------------------
      - name: Wait for Docker image pull
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 20. Read Docker image pull result
      # --------------------------------------------------
      - name: Read Docker image pull result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 21. Start production application
      # --------------------------------------------------
      - name: Start production application
        run: |
          COMMANDS=$(python3 -c 'import json; print(json.dumps({"commands": [
            "set -e",
            "cd /opt/secure-cicd-pipeline-lab",
            "docker compose down || echo \"No existing application to stop.\"",
            "docker compose up -d --force-recreate"
          ]}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 22. Wait for application startup
      # --------------------------------------------------
      - name: Wait for production application startup
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 23. Read production application startup result
      # --------------------------------------------------
      - name: Read production application startup result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 24. Verify production application health
      # --------------------------------------------------
      - name: Verify production application health
        run: |
          COMMANDS=$(python3 -c 'import json; print(json.dumps({"commands": [
            "set -e",
            "curl -fsS http://localhost:5000/health"
          ]}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00b53b698111d659e \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 25. Wait for application health check
      # --------------------------------------------------
      - name: Wait for application health check
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e || true

      # --------------------------------------------------
      # 26. Read application health result
      # --------------------------------------------------
      - name: Read application health result
        run: |
          RESPONSE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00b53b698111d659e \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Status"])')
          RESPONSE_CODE=$(echo "$RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["ResponseCode"])')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ]; then
            echo "SSM command failed: Status=$STATUS ResponseCode=$RESPONSE_CODE"
            exit 1
          fi

      # --------------------------------------------------
      # 27. Set production deployment result
      # --------------------------------------------------
      - name: Set production deployment result
        id: deployment_result
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "Production deployment completed successfully."
            echo "deployment_result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "Production deployment failed."
            echo "deployment_result=failed" >> "$GITHUB_OUTPUT"
          fi