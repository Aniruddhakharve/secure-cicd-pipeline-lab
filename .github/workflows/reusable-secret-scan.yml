name: Reusable Secret Scan

on:
  workflow_call:
    outputs:
        secret_scan_result:
            description: "Result of the Gitleaks secret scan"
            value: ${{ jobs.secret-summary.outputs.secret_scan_result }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout full Git history
          uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
          with:
            fetch-depth: 0

        - name: Run Gitleaks 
          uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-summary:
    if: ${{ always() }}
    needs: secret-scan
    runs-on: ubuntu-latest

    outputs:
        secret_scan_result: ${{ steps.summary.outputs.secret_scan_result }}

    steps:
        - name: Generate secret scan result
          id: summary
          run: |
            if [ "${{ needs.secret-scan.result }}" = "success" ]; then
              echo "Gitleaks secret scan passed."
              echo "secret_scan_result=passed" >> "$GITHUB_OUTPUT"
            else
                echo "Gitleaks secret scan failed."
                echo "secret_scan_result=failed" >> "$GITHUB_OUTPUT"
                exit 1
            fi
