name: Reusable Build and Test

on:
  workflow_call:
    inputs:
        run-tests:
            description: "Whether to run the test suite"
            required: false
            type: boolean
            default: true

    outputs:
        test_result:
            description: "Overall result of the test matrix"
            value: ${{ jobs.test-summary.outputs.test_result }}


jobs:
    build-test:
        if: ${{ inputs.run-tests }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.11", "3.12", "3.13" ]
        
        steps:
            - name: checkout code
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
            
            - name: setup python
              uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
              with:
                python-version: ${{matrix.python-version}}
                cache: "pip"

            - name: Install dependencies
              run: |
                python --version
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt

            - name: Run tests
              id: test
              run: |
                echo "Running tests with Python ${{ matrix.python-version }}"
                python -m pytest

    test-summary:
        if: ${{ always() }}
        needs: build-test

        outputs:
            test_result: ${{ steps.summary.outputs.test_result }}
        
        runs-on: ubuntu-latest
        
        steps:
            - name: Generate test result
              id: summary 
              run: |
                if [ "${{ inputs.run-tests }}" != "true" ]; then
                   echo "Tests were skipped."
                   echo "test_result=skipped" >> "$GITHUB_OUTPUT"
                   exit 0
                fi

                if [ "${{needs.build-test.result}}" = "success" ]; then
                   echo "All matrix test jobs passed."
                   echo "test_result=passed" >> "$GITHUB_OUTPUT"
                else
                   echo "One or more matrix test jobs failed."
                   echo "test_result=failed" >> "$GITHUB_OUTPUT"
                   exit 1
                fi
                